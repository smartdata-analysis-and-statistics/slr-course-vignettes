<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" role="img" aria-labelledby="title desc">
  <title id="title">Equal-weight average of study mean differences in oocyte counts</title>
  <desc id="desc">Six study mean differences are shown on a shared axis. Each study contributes one sixth to the unweighted average of 0.452 oocytes. The vertical grey dashed line marks zero difference and the orange dashed line marks the unweighted mean.</desc>
  <rect width="900" height="470" fill="#ffffff"/>
  <text x="40" y="38" fill="#26476B" font-family="Arial, sans-serif" font-size="22" font-weight="700">Unweighted average of study mean differences</text>
  <text x="40" y="63" fill="#5D6873" font-family="Arial, sans-serif" font-size="14">Each study contributes equally, regardless of its precision</text>
  <text x="40" y="95" fill="#26476B" font-family="Arial, sans-serif" font-size="11" font-weight="700">OBSERVED STUDY MDs</text>
  <text x="790" y="95" text-anchor="middle" fill="#B86A16" font-family="Arial, sans-serif" font-size="11" font-weight="700">EQUAL CONTRIBUTION</text>
  <g font-family="Arial, sans-serif" font-size="12" fill="#26476B">
    <text x="40" y="125">Rettenbacher et al., 2015</text>
    <text x="40" y="156">Strowitzki et al., 2016</text>
    <text x="40" y="187">Barakhoeva et al., 2019</text>
    <text x="40" y="218">Hu et al., 2020</text>
    <text x="40" y="249">Pasqualini et al., 2021</text>
    <text x="40" y="280">Rashidi et al., 2021</text>
  </g>
  <g stroke="#E8EDF1" stroke-width="1">
    <line x1="250" y1="121" x2="730" y2="121"/><line x1="250" y1="152" x2="730" y2="152"/>
    <line x1="250" y1="183" x2="730" y2="183"/><line x1="250" y1="214" x2="730" y2="214"/>
    <line x1="250" y1="245" x2="730" y2="245"/><line x1="250" y1="276" x2="730" y2="276"/>
  </g>
  <!-- Axis maps -1.2 to 2.4 oocytes onto x=250 to x=730. -->
  <g stroke="#5D6873" stroke-width="1">
    <line x1="250" y1="307" x2="730" y2="307"/>
    <line x1="276.7" y1="307" x2="276.7" y2="312"/><line x1="343.3" y1="307" x2="343.3" y2="312"/>
    <line x1="410" y1="307" x2="410" y2="312"/><line x1="476.7" y1="307" x2="476.7" y2="312"/>
    <line x1="543.3" y1="307" x2="543.3" y2="312"/><line x1="610" y1="307" x2="610" y2="312"/>
    <line x1="676.7" y1="307" x2="676.7" y2="312"/>
  </g>
  <g fill="#5D6873" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">
    <text x="276.7" y="329">−1.0</text><text x="343.3" y="329">−0.5</text>
    <text x="410" y="329">0.0</text><text x="476.7" y="329">0.5</text>
    <text x="543.3" y="329">1.0</text><text x="610" y="329">1.5</text><text x="676.7" y="329">2.0</text>
  </g>
  <line x1="410" y1="104" x2="410" y2="307" stroke="#8A969F" stroke-width="1.5" stroke-dasharray="5 5"/>
  <line x1="470.3" y1="104" x2="470.3" y2="307" stroke="#B86A16" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="410" y="110" text-anchor="middle" fill="#5D6873" font-family="Arial, sans-serif" font-size="10">MD = 0</text>
  <text x="470.3" y="300" text-anchor="middle" fill="#B86A16" font-family="Arial, sans-serif" font-size="11" font-weight="700">Mean = 0.452</text>
  <g fill="#26476B" stroke="#ffffff" stroke-width="1.5">
    <circle cx="450" cy="121" r="5"/><circle cx="450" cy="152" r="5"/>
    <circle cx="482" cy="183" r="5"/><circle cx="690" cy="214" r="5"/>
    <circle cx="450" cy="245" r="5"/><circle cx="299.3" cy="276" r="5"/>
  </g>
  <g>
    <rect x="757" y="112" width="66" height="18" rx="4" fill="#F8EADB" stroke="#B86A16"/>
    <rect x="757" y="143" width="66" height="18" rx="4" fill="#F8EADB" stroke="#B86A16"/>
    <rect x="757" y="174" width="66" height="18" rx="4" fill="#F8EADB" stroke="#B86A16"/>
    <rect x="757" y="205" width="66" height="18" rx="4" fill="#F8EADB" stroke="#B86A16"/>
    <rect x="757" y="236" width="66" height="18" rx="4" fill="#F8EADB" stroke="#B86A16"/>
    <rect x="757" y="267" width="66" height="18" rx="4" fill="#F8EADB" stroke="#B86A16"/>
    <g fill="#B86A16" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">
      <text x="790" y="125">1/6</text><text x="790" y="156">1/6</text><text x="790" y="187">1/6</text>
      <text x="790" y="218">1/6</text><text x="790" y="249">1/6</text><text x="790" y="280">1/6</text>
    </g>
  </g>
  <text x="490" y="354" text-anchor="middle" fill="#26476B" font-family="Arial, sans-serif" font-size="13">Mean difference in oocytes (biosimilar − GONAL-f)</text>
  <circle cx="45" cy="390" r="5" fill="#26476B"/>
  <text x="58" y="394" fill="#5D6873" font-family="Arial, sans-serif" font-size="11">Observed study MD</text>
  <line x1="228" y1="390" x2="255" y2="390" stroke="#8A969F" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="263" y="394" fill="#5D6873" font-family="Arial, sans-serif" font-size="11">No difference (MD = 0)</text>
  <line x1="450" y1="390" x2="477" y2="390" stroke="#B86A16" stroke-width="2" stroke-dasharray="7 4"/>
  <text x="485" y="394" fill="#5D6873" font-family="Arial, sans-serif" font-size="11">Unweighted mean MD = 0.452</text>
  <text x="40" y="435" fill="#5D6873" font-family="Arial, sans-serif" font-size="11">Each study has weight 1/6. Confidence intervals are omitted; the figure illustrates equal weighting, not precision.</text>
</svg>
